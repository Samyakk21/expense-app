<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Splitter Toolkit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <span class="brand-icon">💸</span>
        <span class="brand-name">Expense Splitter</span>
      </div>
      <div class="header-actions">
        <span id="sync-status" class="status-badge status-disconnected">● Disconnected</span>
      </div>
    </div>
  </header>

  <div class="app-container">

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Dashboard / Summary Cards -->
    <section class="dashboard">
      <div class="stat-card stat-total">
        <span class="stat-label">Total Expenses</span>
        <span class="stat-value" id="stat-expenses">0</span>
      </div>
      <div class="stat-card stat-amount">
        <span class="stat-label">Total Amount</span>
        <span class="stat-value" id="stat-amount">₹0.00</span>
      </div>
      <div class="stat-card stat-settled">
        <span class="stat-label">Settled</span>
        <span class="stat-value" id="stat-settled">₹0.00</span>
      </div>
      <div class="stat-card stat-pending">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="stat-pending">₹0.00</span>
      </div>
    </section>

    <!-- Users Panel -->
    <section class="panel">
      <div class="panel-header">
        <h2>People</h2>
        <button class="btn btn-outline" onclick="openUserModal()">+ Add Person</button>
      </div>
      <div id="users-list" class="user-list">
        <!-- user chips injected here -->
        <p class="empty-msg">No people added yet.</p>
      </div>
    </section>

    <!-- Add Expense Panel -->
    <section class="panel">
      <div class="panel-header">
        <h2>Add Expense</h2>
      </div>
      <div class="expense-form">
        <div class="form-row">
          <label>Paid by</label>
          <select id="expense-payer" required></select>
        </div>
        <div class="form-row">
          <label>Amount (₹)</label>
          <input type="number" id="expense-amount" step="0.01" min="0" placeholder="0.00" required />
        </div>
        <div class="form-row split-mode-row">
          <label>Split mode</label>
          <div class="toggle-group">
            <button type="button" class="toggle-btn active" id="mode-equal" onclick="setSplitMode('equal')">Equal</button>
            <button type="button" class="toggle-btn" id="mode-exact" onclick="setSplitMode('exact')">Exact</button>
          </div>
        </div>
        <div id="splits-container" class="splits-container">
          <!-- split rows injected here -->
        </div>
        <div class="form-row">
          <button class="btn btn-primary btn-full" onclick="addExpense()">Add Expense</button>
        </div>
      </div>
    </section>

    <!-- Expenses List Panel -->
    <section class="panel">
      <div class="panel-header">
        <h2>Expenses</h2>
        <button class="btn btn-outline" onclick="loadData()">Refresh</button>
      </div>
      <div id="expenses-list" class="expenses-list">
        <!-- expense rows injected here -->
        <p class="empty-msg">No expenses yet.</p>
      </div>
    </section>

    <!-- Balances & Settlements Panel -->
    <section class="panel balances-panel">
      <div class="panel-header">
        <h2>Balances &amp; Settlements</h2>
        <div class="panel-actions">
          <button class="btn btn-outline" onclick="loadBalances()">Balances</button>
          <button class="btn btn-primary" onclick="loadSettlements()">Settlements</button>
        </div>
      </div>
      <div id="balances-output" class="output-area">
        <p class="hint">Click "Balances" or "Settlements" to compute.</p>
      </div>
    </section>

  </div>

  <!-- Add User Modal -->
  <div id="user-modal" class="modal">
    <div class="modal-backdrop" onclick="closeUserModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add Person</h3>
        <button class="btn-close" onclick="closeUserModal()">&times;</button>
      </div>
      <form id="user-form" onsubmit="handleAddUser(event)">
        <div class="form-row">
          <label>Name</label>
          <input type="text" id="modal-user-name" placeholder="e.g. Alice" required />
        </div>
        <div class="form-row">
          <label>ID (optional, auto-assigned)</label>
          <input type="number" id="modal-user-id" placeholder="leave blank for auto" />
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" onclick="closeUserModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Person</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
